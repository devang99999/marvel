# Netlify config at repo root (monorepo: frontend in frontend/)
# Tells Netlify to build and publish the Vite app from frontend/

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
