# Ping Render backend periodically so the free-tier service doesn't spin down (sleep).
# Runs every 14 minutes; Render free tier typically sleeps after ~15 min of inactivity.
name: Ping Render (keep awake)

on:
  schedule:
    - cron: "*/9 * * * *"  # Every 14 minutes
  workflow_dispatch:       # Allow manual run from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        env:
          # Optional: set in repo Settings → Secrets and variables → Actions → Variables
          RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: |
          URL="${RENDER_BACKEND_URL:-https://marvel-b1wd.onrender.com/}"
          echo "Pinging $URL"
          curl -sf --max-time 60 "$URL" -o /dev/null || true
